recipe: default.v1
language: id

pipeline:
- name: WhitespaceTokenizer
- name: RegexFeaturizer
- name: LexicalSyntacticFeaturizer
- name: CountVectorsFeaturizer
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 100
  constrain_similarities: true
- name: EntitySynonymMapper
- name: ResponseSelector
  epochs: 100
- name: FallbackClassifier
  # Dinaikkan dari 0.3 ke 0.6 agar pertanyaan di luar konteks prasarana
  # olahraga tidak dipaksakan masuk ke salah satu intent yang ada.
  # Contoh kasus: "harga tiket pesawat" sebelumnya terklasifikasi sebagai
  # daftar_tarif_kolam hanya karena mengandung kata "harga".
  threshold: 0.6
  ambiguity_threshold: 0.15

policies:
- name: MemoizationPolicy
- name: RulePolicy
- name: TEDPolicy
  max_history: 5
  epochs: 100
  constrain_similarities: true
assistant_id: 20260627-223240-fast-siege
