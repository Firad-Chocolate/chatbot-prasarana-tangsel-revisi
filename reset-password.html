<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kata Sandi Baru — Prasarana Olahraga Tangsel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--dark-bg-card);
            border: 1px solid var(--dark-border);
            border-radius: 18px;
            padding: 34px 30px 30px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .45);
        }
        .auth-logo {
            display: block;
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            object-fit: contain;
        }
        .auth-card h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            text-align: center;
            margin: 0 0 8px;
            color: var(--white);
        }
        .auth-keterangan {
            margin: 0 0 22px;
            text-align: center;
            font-size: .85rem;
            line-height: 1.5;
            color: var(--dark-text-muted);
        }
        .auth-field { margin-bottom: 15px; }
        .auth-field label {
            display: block;
            font-size: .76rem;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--dark-text-muted);
            margin-bottom: 6px;
        }
        .auth-field input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid var(--dark-border);
            border-radius: 9px;
            background: var(--dark-bg-messages);
            color: var(--dark-text-primary);
            font-family: inherit;
            font-size: .95rem;
        }
        .auth-field input:focus {
            outline: 2px solid var(--tangsel-gold);
            outline-offset: 1px;
            border-color: transparent;
        }
        .auth-submit {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 0;
            border-radius: 9px;
            background: var(--tangsel-gold);
            color: #1a1a1a;
            font-family: inherit;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
        }
        .auth-submit:hover { background: #ffc63d; }
        .auth-submit:disabled { opacity: .55; cursor: not-allowed; }
        .auth-pesan {
            padding: 10px 13px;
            border-radius: 9px;
            font-size: .85rem;
            line-height: 1.45;
            margin-bottom: 18px;
        }
        .auth-pesan.galat {
            background: rgba(224, 36, 36, .14);
            border: 1px solid rgba(224, 36, 36, .45);
            color: #ffb4b4;
        }
        .auth-pesan.sukses {
            background: rgba(34, 197, 94, .14);
            border: 1px solid rgba(34, 197, 94, .45);
            color: #a7f3c8;
        }
        .auth-kaki {
            margin-top: 20px;
            text-align: center;
            font-size: .82rem;
        }
        .auth-kaki a { color: var(--tangsel-gold); text-decoration: none; }
        .tersembunyi { display: none !important; }
    </style>
</head>
<body>
<div class="auth-page">
    <main class="auth-card">
        <img src="image/1782666392920.png" alt="Logo Kota Tangerang Selatan" class="auth-logo">
        <h1>Buat kata sandi baru</h1>
        <p class="auth-keterangan" id="keterangan">Memeriksa tautan…</p>

        <div id="pesan" class="auth-pesan tersembunyi"></div>

        <form id="form-reset" class="tersembunyi">
            <div class="auth-field">
                <label for="sandi-baru">Kata sandi baru</label>
                <input type="password" id="sandi-baru" autocomplete="new-password"
                       minlength="8" required>
            </div>
            <div class="auth-field">
                <label for="sandi-ulang">Ulangi kata sandi</label>
                <input type="password" id="sandi-ulang" autocomplete="new-password"
                       minlength="8" required>
            </div>
            <button type="submit" class="auth-submit" id="tombol-simpan">Simpan kata sandi</button>
        </form>

        <p class="auth-kaki"><a href="login.html">Kembali ke halaman masuk</a></p>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
    const elPesan  = document.getElementById("pesan");
    const elKet    = document.getElementById("keterangan");
    const formEl   = document.getElementById("form-reset");

    function tampilkanPesan(teks, jenis) {
        elPesan.textContent = teks;
        elPesan.className = "auth-pesan " + jenis;
    }

    // Saat pengguna mengklik tautan di email, Supabase mengembalikannya ke
    // halaman ini dengan token pemulihan di URL. Pustaka Supabase membaca
    // token itu sendiri lalu memancarkan event PASSWORD_RECOVERY, yang
    // menandakan sesi sementara sudah siap dipakai mengganti sandi.
    let sesiSiap = false;

    sb.auth.onAuthStateChange(function (event) {
        if (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") {
            sesiSiap = true;
            elKet.textContent = "Pilih kata sandi baru, minimal 8 karakter.";
            formEl.classList.remove("tersembunyi");
        }
    });

    // Cadangan: kalau sesi sudah terbentuk sebelum listener terpasang.
    setTimeout(async function () {
        if (sesiSiap) return;
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
            sesiSiap = true;
            elKet.textContent = "Pilih kata sandi baru, minimal 8 karakter.";
            formEl.classList.remove("tersembunyi");
        } else {
            elKet.textContent = "";
            tampilkanPesan(
                "Tautan tidak berlaku atau sudah kedaluwarsa. " +
                "Minta tautan reset yang baru dari halaman masuk.", "galat");
        }
    }, 1800);

    formEl.addEventListener("submit", async function (e) {
        e.preventDefault();

        const baru  = document.getElementById("sandi-baru").value;
        const ulang = document.getElementById("sandi-ulang").value;

        if (baru !== ulang) {
            tampilkanPesan("Kedua kata sandi belum sama.", "galat");
            return;
        }

        const tombol = document.getElementById("tombol-simpan");
        tombol.disabled = true;
        tombol.textContent = "Menyimpan…";

        const { error } = await sb.auth.updateUser({ password: baru });

        if (error) {
            tampilkanPesan(error.message, "galat");
            tombol.disabled = false;
            tombol.textContent = "Simpan kata sandi";
            return;
        }

        formEl.classList.add("tersembunyi");
        elKet.textContent = "";
        tampilkanPesan(
            "Kata sandi berhasil diganti. Mengarahkan ke halaman masuk…", "sukses");

        // Sesi pemulihan diakhiri supaya pengguna masuk ulang dengan
        // kata sandi barunya.
        await sb.auth.signOut();
        setTimeout(function () {
            window.location.replace(BASE + "login.html");
        }, 2200);
    });
})();
</script>
</body>
</html>
